name: Main Promotion Policy Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Main promotion denial and fast-forward tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: python3 -I .github/scripts/test_main_promotion.py
